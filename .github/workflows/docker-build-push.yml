name: Build and Push Docker Images

on:
    push:
        branches:
            - main
        tags:
            - "v*"
    pull_request:
        branches:
            - main
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # TensorFlow image
            - name: Extract metadata (tensorflow)
              id: meta-tensorflow
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-tensorflow
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=sha,prefix={{branch}}-
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push TensorFlow image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: Dockerfile.tensorflow
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta-tensorflow.outputs.tags }}
                  labels: ${{ steps.meta-tensorflow.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # PyTorch image
            - name: Extract metadata (pytorch)
              id: meta-pytorch
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-pytorch
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=sha,prefix={{branch}}-
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push PyTorch image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: Dockerfile.pytorch
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta-pytorch.outputs.tags }}
                  labels: ${{ steps.meta-pytorch.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # Both image
            - name: Extract metadata (both)
              id: meta-both
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-both
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=sha,prefix={{branch}}-
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push Both image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: Dockerfile.both
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta-both.outputs.tags }}
                  labels: ${{ steps.meta-both.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
